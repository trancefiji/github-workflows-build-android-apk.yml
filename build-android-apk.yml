name: Build Wickline Android APK

# Builds an installable Android APK of Wickline (keptaduona/wickline) on GitHub's servers.
# Run it from the Actions tab -> "Build Wickline Android APK" -> Run workflow.
# When it finishes, download the "wickline-android-apk" artifact from the run page.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Get the Wickline source
        uses: actions/checkout@v4
        with:
          repository: keptaduona/wickline
          path: wickline

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Create the Capacitor Android project
        run: |
          mkdir app && cd app
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npm install -D @capacitor/assets
          cp -r ../wickline/public www
          mkdir assets
          cp ../wickline/build/icon.png assets/icon-only.png
          cp ../wickline/build/icon.png assets/icon-foreground.png
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "io.github.wickline.mobile",
            "appName": "Wickline",
            "webDir": "www",
            "server": { "androidScheme": "http", "cleartext": true }
          }
          EOF
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor '#0b0e13' --iconBackgroundColorDark '#0b0e13'
          npx cap sync android

      - name: Build the debug APK
        working-directory: app/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: wickline-android-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
